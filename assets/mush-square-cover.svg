<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="sqCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="sqBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.7)" />
      <stop offset="100%" stop-color="rgba(138, 43, 226, 0.3)" />
    </linearGradient>

    <filter id="sqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="sqGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#sqBg)" />
  <rect width="800" height="800" fill="url(#sqGrid)" />

  <!-- Ambient Glows -->
  <circle cx="400" cy="350" r="280" fill="#00f2fe" opacity="0.1" filter="url(#sqGlow)" />
  <circle cx="200" cy="650" r="180" fill="#8a2be2" opacity="0.12" filter="url(#sqGlow)" />

  <!-- Outer Cyber Frame -->
  <rect x="40" y="40" width="720" height="720" rx="32" fill="none" stroke="url(#sqBorder)" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(400, 110)" text-anchor="middle">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <circle cx="-110" cy="0" r="5" fill="#10b981" />
    <text x="-90" y="5" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="start">NATIVE HARNESS v0.1.0</text>
  </g>

  <!-- Central Logo & Brand -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Big Logo -->
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" letter-spacing="4" filter="url(#sqGlow)">
      mush<tspan fill="url(#sqCyan)">.</tspan>
    </text>
    <text x="0" y="50" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="1">
      跨模型原厂战衣协同工作台
    </text>
  </g>

  <!-- 4 Model Sled Badges (2x2 Matrix) -->
  <g transform="translate(100, 370)">
    <!-- Claude Code Badge -->
    <g transform="translate(0, 0)">
      <rect width="280" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="rgba(0, 242, 254, 0.15)" />
      <text x="35" y="40" fill="#00f2fe" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">C</text>
      <text x="65" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Claude Code</text>
      <text x="65" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">Opus 5 / Sonnet 5</text>
    </g>

    <!-- DeepSeek Badge -->
    <g transform="translate(320, 0)">
      <rect width="280" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(138, 43, 226, 0.3)" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="rgba(138, 43, 226, 0.15)" />
      <text x="35" y="40" fill="#8a2be2" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">D</text>
      <text x="65" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">DeepSeek dsh</text>
      <text x="65" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">V4-Pro / V3.2</text>
    </g>

    <!-- Google Gemini Badge -->
    <g transform="translate(0, 90)">
      <rect width="280" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="rgba(16, 185, 129, 0.15)" />
      <text x="35" y="40" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">G</text>
      <text x="65" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Google agy</text>
      <text x="65" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">Gemini 3.7 / 3.1</text>
    </g>

    <!-- OpenAI Codex Badge -->
    <g transform="translate(320, 90)">
      <rect width="280" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="rgba(245, 158, 11, 0.15)" />
      <text x="35" y="40" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">O</text>
      <text x="65" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">OpenAI Codex</text>
      <text x="65" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">GPT-5.6 / o3</text>
    </g>
  </g>

  <!-- Bottom Feature Pill Bars -->
  <g transform="translate(100, 580)">
    <rect width="600" height="120" rx="20" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <g transform="translate(30, 28)">
      <circle cx="10" cy="10" r="6" fill="#10b981" />
      <text x="26" y="15" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">纯本地零信任</text>
      <text x="26" y="32" fill="#64748b" font-family="sans-serif" font-size="11">代码 100% 不出本机</text>
    </g>

    <g transform="translate(230, 28)">
      <circle cx="10" cy="10" r="6" fill="#f59e0b" />
      <text x="26" y="15" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">权威审批闸门</text>
      <text x="26" y="32" fill="#64748b" font-family="sans-serif" font-size="11">卡片式点批防误删</text>
    </g>

    <g transform="translate(430, 28)">
      <circle cx="10" cy="10" r="6" fill="#38bdf8" />
      <text x="26" y="15" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">预算防爆锁</text>
      <text x="26" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Micro-USD 真实台账</text>
    </g>

    <!-- Footer Tagline -->
    <text x="300" y="95" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      GREEN PORTABLE · 0 CONFIG · 557 TESTS PASS
    </text>
  </g>
</svg>
